[build]
# Keep build artifacts in a shared target directory
# target-dir = "target"  # default, explicit for clarity

# NOTE: Windows-specific OpenSSL paths used to live in a [env] block here.
# They have been moved to docs/WINDOWS_BUILD.md so this Cargo config stays
# portable across Linux / macOS / Windows. If you hit an openssl-sys linker
# error on Windows, export OPENSSL_DIR / OPENSSL_LIB_DIR / OPENSSL_INCLUDE_DIR
# in your shell before building — see docs/WINDOWS_BUILD.md.

[alias]
clawd = "run --bin clawd --"
claw  = "run --bin claw --"

# Enforce no unsafe in security-sensitive crates at the workspace level.
# Individual crates can opt-in to unsafe with an explicit override.
# [target.'cfg(all())'.rustflags]
# Leave this commented; enforce via #![forbid(unsafe_code)] in each crate instead.
